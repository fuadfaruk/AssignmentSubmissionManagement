version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: assignment_postgres
    environment:
      POSTGRES_DB: AssignmentMgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AssignmentMgmt"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assignment_backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AssignmentMgmt;Username=postgres;Password=postgrespassword
      - Jwt__Key=SuperSecretKeyForAssignmentSubmissionManagement123!
      - Jwt__Issuer=AssignmentApi
      - Jwt__Audience=AssignmentClient
      - Jwt__ExpiryMinutes=60
      - Cors__AllowedOrigins__0=http://localhost:3000
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: assignment_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
